<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productlevertijd-routekaart</title><style>
:root { --ink:#17233a; --muted:#627087; --paper:#f6f8fc; --card:#fff; --line:#dce3ee; --supplier:#e85d4a; --dc:#7357d8; --edc:#1a9b8a; --partner:#e29b25; --home:#2780c5; }
* { box-sizing:border-box; }
body { margin:0; background:linear-gradient(180deg,#eef4fb 0,#f9fbfe 340px); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
main { width:min(1160px,calc(100% - 32px)); margin:0 auto; padding:42px 0 56px; }
header { margin-bottom:24px; }
.eyebrow { color:var(--home); font-size:.78rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; margin:0 0 8px; }
h1 { font-size:clamp(2rem,4vw,3.4rem); letter-spacing:-.04em; line-height:1; margin:0 0 12px; }
header>p:last-child { color:var(--muted); margin:0; }
label { display:grid; gap:6px; font-size:.83rem; font-weight:700; color:var(--muted); }
input,select { width:100%; border:1px solid #cbd5e4; border-radius:9px; background:#fff; color:var(--ink); padding:10px; font:inherit; }
input:focus,select:focus { outline:3px solid #b9d9f4; border-color:var(--home); }
.label-with-info { display:flex; align-items:center; gap:6px; }
.info-wrap { position:relative; display:inline-flex; }
.info-button { display:inline-grid; place-items:center; width:18px; height:18px; padding:0; border:1px solid #9bb0c8; border-radius:50%; background:#fff; color:#315c82; font-size:.7rem; font-weight:700; cursor:help; }
.info-tooltip { position:absolute; left:50%; bottom:calc(100% + 9px); z-index:20; width:280px; padding:10px 12px; border-radius:10px; background:var(--ink); color:#fff; font-size:.76rem; font-weight:400; line-height:1.45; box-shadow:0 10px 28px rgba(23,35,58,.22); opacity:0; visibility:hidden; transform:translate(-50%,4px); transition:opacity .15s,transform .15s,visibility .15s; pointer-events:none; }
.info-tooltip::after { content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:6px solid transparent; border-top-color:var(--ink); }
.info-wrap:hover .info-tooltip,.info-wrap:focus-within .info-tooltip { opacity:1; visibility:visible; transform:translate(-50%,0); }
.mode-switch { display:flex; gap:8px; margin-bottom:18px; }
.mode-switch button { border:1px solid #cbd5e4; border-radius:999px; background:#fff; color:var(--muted); padding:10px 18px; font-weight:700; cursor:pointer; }
.mode-switch button.selected { background:var(--ink); color:#fff; border-color:var(--ink); }
.control-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.route-map { height:500px; position:relative; overflow:hidden; border:1px solid #cfdae8; border-radius:24px; background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(230,239,248,.82)),radial-gradient(circle at 20% 20%,#fff 0 2px,transparent 3px) 0 0/28px 28px,#edf3f8; box-shadow:0 20px 50px rgba(35,57,90,.1); }
.route-map::after { content:""; position:absolute; left:0; right:0; bottom:0; height:62px; z-index:0; background:linear-gradient(180deg,transparent,rgba(39,128,197,.07)); border-top:1px dashed rgba(39,128,197,.16); }
.map-heading { position:absolute; z-index:4; left:50%; top:14px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid #cbd9e8; border-radius:999px; background:rgba(255,255,255,.92); box-shadow:0 7px 18px rgba(35,57,90,.08); white-space:nowrap; }
.map-heading span,.map-zone { color:var(--muted); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; }.map-heading strong{font-size:.77rem}.map-zone{position:absolute;z-index:0;font-weight:700}.map-zone-origin{left:18px;top:180px;writing-mode:vertical-rl;transform:rotate(180deg)}.map-zone-destination{right:18px;top:145px}
.operation-cluster { position:absolute; z-index:0; left:33%; top:184px; width:40.5%; height:252px; padding:10px 12px; border:2px dashed rgba(26,155,138,.32); border-radius:20px; background:linear-gradient(145deg,rgba(26,155,138,.08),rgba(226,155,37,.08)); pointer-events:none; }
.operation-cluster span,.operation-cluster strong { display:block; }.operation-cluster span { color:var(--muted); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; }.operation-cluster strong { margin-top:3px; color:#286f67; font-size:.78rem; }
.routes { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
.road { fill:none; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .18s; }
.road.active { opacity:1; }
.supplier-road { stroke:var(--supplier); } .dc-road { stroke:var(--dc); } .edc-road { stroke:var(--edc); } .partner-road { stroke:var(--partner); }
#arrow-supplier path { fill:var(--supplier); } #arrow-dc path { fill:var(--dc); } #arrow-edc path { fill:var(--edc); } #arrow-partner path { fill:var(--partner); }
.place { position:absolute; z-index:3; width:150px; padding:14px; background:var(--card); border:2px solid var(--line); border-radius:16px; box-shadow:0 10px 24px rgba(35,57,90,.08); }
.place.active { box-shadow:0 0 0 4px rgba(23,35,58,.12),0 12px 30px rgba(35,57,90,.14); }
.place-title { display:flex; align-items:center; gap:9px; margin-bottom:11px; }
.node-icon { display:grid; place-items:center; width:34px; height:34px; flex:0 0 34px; border-radius:10px; background:rgba(255,255,255,.8); box-shadow:inset 0 0 0 1px rgba(23,35,58,.08); font-size:1.25rem; }
.place-icon { font-size:1.45rem; }
.value-pair { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.value-pair label { min-width:0; font-size:.72rem; }
.number { position:relative; }.number input { padding-right:33px; }.number small { position:absolute; right:7px; top:11px; color:var(--muted); font-size:.65rem; }
.supplier { left:2%; top:28px; border-color:var(--supplier); background:#fff7f5; }.dc { left:2%; top:348px; border-color:var(--dc); background:#f8f6ff; }.edc { left:35%; top:348px; border-color:var(--edc); background:#f1fbf9; }.partner { left:52%; top:245px; border-color:var(--partner); background:#fffaf0; }.home { right:2%; top:205px; border-color:var(--home); background:#f2f8fd; }
.partner .place-title strong { min-width:0; font-size:.72rem; line-height:1.15; overflow-wrap:anywhere; }
.muted { display:block; color:var(--muted); font-size:.75rem; }.delivery-date { font-weight:700; margin-top:5px; }
.truck { display:none; position:absolute; z-index:2; font-size:1.6rem; }.truck.show { display:block; }.truck-a { left:40%; top:130px; }.truck-b { left:45%; top:342px; }.truck-c { left:79%; top:230px; }
.cutoffs { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(520px,100%); margin:18px 0; }
.comparison { border-top:1px solid var(--line); padding-top:14px; }.scenario-line { display:flex; align-items:center; gap:12px; margin:0 0 12px 150px; }.scenario-line span { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }.scenario-line strong { padding:5px 9px; border-radius:999px; background:#e7f2fb; color:#1c679d; font-size:.82rem; }.legend { display:flex; gap:16px; margin:0 0 12px 150px; color:var(--muted); font-size:.82rem; }.legend i { display:inline-block; width:16px; height:8px; border-radius:2px; margin-right:5px; background:var(--home); }.legend .current-swatch { opacity:.38; }
.summary { display:grid; grid-template-columns:140px 1fr 80px; gap:12px; align-items:center; margin:10px 0; }.summary.unavailable { color:var(--muted); }.bars { display:grid; gap:5px; }.bars>div { height:17px; background:#e7edf5; border-radius:5px; overflow:hidden; }.bars span { display:block; height:100%; background:var(--home); border-radius:5px; transition:width .18s; }.bars>div:first-child span { opacity:.38; }
.table-wrap { overflow-x:auto; margin-top:20px; }table { width:100%; border-collapse:collapse; min-width:690px; }th,td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); font-size:.88rem; }thead th { color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; }
footer { color:var(--muted); font-size:.82rem; margin-top:18px; }
.scope { margin-top:22px; padding:18px 20px; background:#fff; border:1px solid var(--line); border-left:5px solid var(--home); border-radius:14px; box-shadow:0 8px 24px rgba(35,57,90,.06); }
.scope h2 { margin:0 0 10px; font-size:1.05rem; letter-spacing:-.01em; }
.scope ul { margin:0; padding-left:20px; color:var(--muted); }
.scope li { padding-left:2px; }
.shared-layout { display:grid; grid-template-columns:410px minmax(0,1fr); gap:20px; align-items:start; }
.flow-column { min-width:0; }
.config-panel { position:sticky; top:16px; padding:12px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 32px rgba(35,57,90,.08); }
.config-panel h2 { margin:0 0 3px; font-size:1rem; }.config-panel>p,.config-panel>small { color:var(--muted); font-size:.7rem; }.config-panel>p{margin:0 0 8px}.config-panel>small{display:block;margin-top:7px}.config-scroll{overflow-x:auto}.config-panel table{width:100%;min-width:370px;table-layout:auto}.config-panel th,.config-panel td{padding:6px 3px;font-size:.68rem;text-align:center}.config-panel thead th:first-child{width:112px}.config-panel tbody th{text-align:left;white-space:normal;overflow:visible;line-height:1.25}.config-panel input{min-width:0;padding:6px 4px;text-align:center;font-size:.75rem;border-radius:6px}.config-panel input[type="number"]{width:48px}.config-panel input[type="time"]{width:78px}.config-panel input:disabled{background:#edf1f6;color:#8793a5}.active-config{background:#edf8f5}.active-config th{color:#137365}
.place.simple { min-height:74px; }.place.simple .place-title{margin:0}.place.simple small,.place.simple b{display:block}.place.simple b{margin-top:5px}.cutoff-used{margin:12px 0 18px;padding:9px 12px;background:#e7f2fb;border-radius:10px;color:#1c679d;width:max-content;max-width:100%}
.collect-controls { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.collect-outcome { display:grid; grid-template-columns:90px 1fr auto; gap:12px; align-items:center; margin-top:18px; padding:16px; background:#edf8f5; border-left:5px solid var(--edc); border-radius:12px }.collect-outcome.blocked{background:#fff3f1;border-left-color:var(--supplier)}.collect-outcome>span{color:var(--muted);font-size:.75rem;text-transform:uppercase}.collect-comparison{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.collect-controls { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.collect-map { height:410px; position:relative; overflow:hidden; border:1px solid var(--line); border-radius:24px; background:radial-gradient(circle at 20% 20%,#fff 0 2px,transparent 3px) 0 0/28px 28px,#edf3f8; box-shadow:0 20px 50px rgba(35,57,90,.08); }
.collect-routes { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
.collect-road { fill:none; stroke-width:7; stroke-linecap:round; opacity:0; }.collect-road.active{opacity:1}.supplier-path{stroke:var(--supplier)}.dc-path{stroke:var(--dc)}.edc-path{stroke:var(--edc)}#arrow-store path{fill:var(--home)}
.collect-node { position:absolute; z-index:3; width:170px; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:9px; padding:16px; background:#fff; border:2px solid var(--line); border-radius:16px; box-shadow:0 10px 24px rgba(35,57,90,.08); }.collect-node>span{font-size:1.45rem}.collect-node small,.collect-node b{grid-column:1/-1}.collect-node small{color:var(--muted)}.collect-supplier{left:2%;top:28px;border-color:var(--supplier)}.collect-dc{left:2%;bottom:28px;border-color:var(--dc)}.collect-edc{left:35%;bottom:28px;border-color:var(--edc)}.collect-store{right:2%;top:150px;border-color:var(--home);background:#f2f8fd}.collect-store.active{box-shadow:0 0 0 4px rgba(39,128,197,.15),0 12px 30px rgba(35,57,90,.14)}
.store-stock-note{position:absolute;right:21%;top:185px;color:var(--home);font-weight:700;background:#fff;padding:8px 12px;border-radius:999px;border:1px solid #b9d9f4}
.collect-outcome { display:grid; grid-template-columns:100px 1fr auto; align-items:center; gap:14px; margin-top:18px; padding:16px 18px; border-radius:14px; background:#edf8f5; border-left:5px solid var(--edc); }.collect-outcome>span{color:var(--muted);text-transform:uppercase;font-size:.75rem;letter-spacing:.06em}.collect-outcome.blocked{background:#fff3f1;border-left-color:var(--supplier)}.collect-comparison{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:1000px){.shared-layout{grid-template-columns:1fr}.config-panel{position:static}.config-panel table{min-width:370px}.config-panel thead th:first-child{width:120px}}
@media(max-width:760px){.control-strip,.collect-controls{grid-template-columns:1fr 1fr}.route-map,.collect-map{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:64px 14px 14px}.routes,.truck,.collect-routes,.map-zone,.operation-cluster{display:none!important}.place,.collect-node{position:static;width:auto}.home{min-height:120px}.summary{grid-template-columns:105px 1fr 65px}.scenario-line,.legend{margin-left:117px}.store-stock-note{position:static;grid-column:1/-1}.collect-outcome{grid-template-columns:1fr}.collect-outcome b{justify-self:start}}
@media(max-width:480px){main{width:min(100% - 20px,1160px);padding-top:24px}.control-strip,.route-map,.cutoffs,.collect-controls,.collect-map{grid-template-columns:1fr}.summary{grid-template-columns:90px 1fr 58px;font-size:.8rem}.scenario-line,.legend{margin-left:102px}.scenario-line{align-items:flex-start;flex-direction:column;gap:5px}.mode-switch{flex-direction:column}.mode-switch button{width:100%}}
@media(max-width:480px){.info-tooltip{left:auto;right:-8px;transform:translateY(4px);width:min(280px,calc(100vw - 36px))}.info-wrap:hover .info-tooltip,.info-wrap:focus-within .info-tooltip{transform:translateY(0)}.info-tooltip::after{left:auto;right:10px}}
